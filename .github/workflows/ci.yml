name: CI

on:
  push:
    branches:
      - main
      - 'emma/**'
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release
