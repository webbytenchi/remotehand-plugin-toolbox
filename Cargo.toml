[package]
name = "remotehand-toolbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "RemoteHand Toolbox plugin"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }

[[bin]]
name = "remotehand-toolbox"
path = "src/main.rs"
